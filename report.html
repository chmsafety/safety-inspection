<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전보건점검 결과보고서</title>
<meta name="theme-color" content="#1e40af">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box}
html{font-size:17.5px}
@media(max-width:640px){html{font-size:16.5px}}
body{margin:0;background:#f4f6f9;font-family:'Noto Sans KR',-apple-system,Arial,sans-serif;color:#0f172a;overflow-x:hidden}
.hd{background:#1e40af;color:#fff;padding:.9rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem}
.hd .t{font-size:.95rem;font-weight:800}
.hd .s{font-size:.72rem;opacity:.8;margin-top:.15rem}
.hd button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:6px;padding:.4rem .8rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:1rem}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1rem;overflow-x:hidden}
.card img{max-width:100%}
.msg{text-align:center;padding:3.5rem 1.2rem;color:#64748b;font-size:.9rem;line-height:1.7}
.msg b{display:block;font-size:1rem;color:#0f172a;margin-bottom:.4rem}
.foot{text-align:center;font-size:.68rem;color:#94a3b8;padding:1rem}

/* ── 보고서 본문(서버가 만든 HTML) 모바일 보정 ── */
/* 띄어쓰기 없는 긴 글(예: ddddd…)이 화면 밖으로 밀려나가지 않게 한다 */
#body{overflow-wrap:anywhere;word-break:break-word}
#body *{max-width:100%;box-sizing:border-box;min-width:0}
#body table{width:100%!important;table-layout:fixed;border-collapse:collapse}
#body td,#body th{vertical-align:top}
#body img{max-width:100%;height:auto}
.note-box{white-space:pre-wrap}
.note-box.clamped{max-height:3.2em;overflow:hidden}
.note-more{background:none;border:none;color:#1e40af;font-size:.7rem;font-weight:700;padding:.15rem 0 0;cursor:pointer;font-family:inherit}
/* 모바일용 인쇄 버튼 — 상단 바를 감추는 대신 본문 아래에 둔다 */
.print-m{display:none}
@media (max-width:640px){
  /* 상단 바는 아래 보고서 머리글과 내용이 같아 감춘다 */
  .hd{display:none}
  /* 표를 화면 폭 가득 쓰도록 좌우 여백을 없앤다 */
  .wrap{padding:0}
  .card{padding:0;border:none;border-radius:0;background:transparent}
  .print-m{display:block;width:calc(100% - 1rem);margin:.7rem .5rem 0;padding:.7rem;border:none;border-radius:8px;
           background:#1e40af;color:#fff;font-weight:700;font-size:.85rem;font-family:inherit;cursor:pointer}
  #body{font-size:13px}
  /* 사업장 · 점검정보가 등급 상자에 밀려 줄바꿈되지 않도록 */
  #body .rpt-head{padding:12px 14px!important;gap:8px!important;align-items:center!important}
  #body .rpt-site{font-size:17px!important}
  #body .rpt-meta{font-size:11px!important;line-height:1.5}
  #body .rpt-tbl th,#body .rpt-tbl td{padding:5px 6px!important;font-size:12px!important}
}
@media (max-width:400px){
  #body .rpt-meta{font-size:10px!important}
}
@media print{.hd,.foot,.print-m{display:none}body{background:#fff}.wrap{padding:0}.card{border:none;padding:0}}
</style>
</head>
<body>
<div class="hd">
  <div>
    <div class="t">안전보건점검 결과보고서</div>
    <div class="s" id="sub">불러오는 중…</div>
  </div>
  <button onclick="window.print()">인쇄 / PDF</button>
</div>
<div class="wrap">
  <div id="body" class="msg">보고서를 불러오는 중입니다…</div>
  <button class="print-m" onclick="window.print()">🖨 인쇄 / PDF</button>
</div>
<div class="foot">안전보건점검 관리시스템 · 이 링크는 발송일로부터 30일간 유효합니다</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxXxTN3i6E8oxjdhYZhGwbc_QD3J016lui6Y8-Okh9b1k2F7rb4ua92W_FJQRE-TwaL0g/exec";

// 연-월-일만 남긴다 (시트에서 온 값이 'Mon Sep 07 2026 …' 형태일 수 있다)
function ymd(v){
  if(!v) return "";
  const m = String(v).match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m) return m[1] + "-" + ("0"+m[2]).slice(-2) + "-" + ("0"+m[3]).slice(-2);
  const t = new Date(v);
  if(!isNaN(t.getTime())){
    return t.getFullYear() + "-" + ("0"+(t.getMonth()+1)).slice(-2) + "-" + ("0"+t.getDate()).slice(-2);
  }
  return String(v);
}

// 비고가 길면 두 줄로 접고 [더보기]로 펼친다 (표가 밀리는 것을 막는다)
function foldNotes(){
  document.querySelectorAll("#body .rpt-note").forEach(el=>{
    const text = el.textContent.trim();
    if(text.length <= 40) return;
    el.textContent = "";
    const box = document.createElement("div");
    box.className = "note-box clamped";
    box.textContent = text;
    const btn = document.createElement("button");
    btn.className = "note-more";
    btn.textContent = "더보기";
    btn.onclick = () => {
      const folded = box.classList.toggle("clamped");
      btn.textContent = folded ? "더보기" : "접기";
    };
    el.appendChild(box);
    el.appendChild(btn);
  });
}

function show(html, plain){
  const el = document.getElementById("body");
  el.className = plain ? "msg" : "card";
  el.innerHTML = html;
}

(async function(){
  const t = new URLSearchParams(location.search).get("t");
  if(!t){ show("<b>잘못된 링크입니다</b>주소가 온전한지 확인해주세요.", true); return; }
  try{
    const res  = await fetch(API + "?mode=rpt_open&token=" + encodeURIComponent(t));
    const data = await res.json();
    if(!data || data.status !== "ok"){
      show("<b>링크를 열 수 없습니다</b>" + ((data && data.msg) || "만료되었거나 올바르지 않은 링크입니다."), true);
      document.getElementById("sub").textContent = "";
      return;
    }
    const day = ymd(data.date);
    document.getElementById("sub").textContent = data.site + " · " + day;
    document.title = "점검결과 " + data.site + " (" + day + ")";
    show(data.html, false);
    foldNotes();
  }catch(e){
    show("<b>불러오지 못했습니다</b>네트워크 상태를 확인한 뒤 다시 시도해주세요.", true);
  }
})();
</script>
</body>
</html>
